name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, pdo_sqlite, zip

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint
        run: |
          find core extensions bin public tests config -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /tmp/lint.log || { grep -v '^No syntax errors' /tmp/lint.log; exit 1; }

      - name: Tests
        run: php tests/run.php
